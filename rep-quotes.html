  var KEEP = 'ausave-gate-v1';
  var form = document.getElementById('gate-form'), msg = document.getElementById('gate-msg'), go = document.getElementById('gate-go');
  var unb64 = function (s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
  var b64 = function (u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
  var kept = function () { try { var a = JSON.parse(localStorage.getItem(KEEP) || '[]'); return Array.isArray(a) ? a.filter(function (x) { return typeof x === 'string'; }) : []; } catch (e) { return []; } };

  // a stretched key opens the page if it unwraps one of the page's key slots
  async function openWith(kekBytes) {
    var kek = await crypto.subtle.importKey('raw', kekBytes, { name: 'AES-GCM' }, false, ['decrypt']);
    for (var i = 0; i < P.slots.length; i++) {
      try {
        var raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(P.slots[i].iv) }, kek, unb64(P.slots[i].ct));
        var cek = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
        var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(P.iv) }, cek, unb64(P.ct));
        return new TextDecoder().decode(plain);
      } catch (e) { /* not this slot */ }
    }
    return null;
  }
  async function stretch(password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(P.s), iterations: P.n, hash: 'SHA-256' }, base, 256));
  }
  // The unlocked page replaces this one. That must wait until this page has finished loading: written any earlier (a
  // remembered key opens a small page before the browser is done with this one) it is merged into the lock page instead.
  function show(html) {
    var write = function () { setTimeout(function () { document.open(); document.write(html); document.close(); }, 0); };
    if (document.readyState === 'complete') write(); else window.addEventListener('load', write, { once: true });
  }

  async function start() {
    if (!(window.crypto && crypto.subtle)) { form.hidden = false; go.disabled = true; msg.textContent = "This browser can't open the page. Use Safari or Chrome over https."; return; }
    var keys = kept();

      try { var html = await openWith(unb64(keys[i])); if (html) { show(html); return; } } catch (e) { /* stale key */ }
